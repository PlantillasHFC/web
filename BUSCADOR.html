        function buscarOLT() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const resultBody = document.getElementById("resultBody");

            // Limpiar tabla antes de mostrar resultados
            resultBody.innerHTML = "";

            // Filtrar OLTs que coincidan con la búsqueda
            const resultados = olts.filter(olt => olt.nombre.toLowerCase().includes(input));

            // Insertar resultados en la tabla
            resultados.forEach(olt => {
                const row = `<tr>
                                <td>${olt.nombre}</td>
                                <td>${olt.ip}</td>
                                <td>${olt.ubicacion}</td>
                                <td>${olt.modelo}</td>
                            </tr>`;
                resultBody.innerHTML += row;
            });
        }
